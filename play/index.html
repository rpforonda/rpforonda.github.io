<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Block Coders</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0d14; }
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }

      /* Touch devices that can go full screen get one small start card, before the game.
         The game lays itself out for phones held either way, so nothing covers it after this. */
      #start {
        position: fixed; inset: 0; z-index: 10; display: none;
        flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: rgb(11 13 20 / 0.92); color: #e7e9f2; text-align: center;
        font: 600 20px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #start.show { display: flex; }
      #start p { margin: 0 0 8px; }
      .btn {
        font: inherit; font-size: 17px; cursor: pointer; border-radius: 12px; padding: 12px 22px;
        border: 2px solid #7c5cff; background: #7c5cff; color: #fff; min-height: 48px; min-width: 220px;
      }
      .btn.ghost { background: transparent; color: #c9c2ff; border-color: #393e57; }
    </style>
  </head>
  <body>
    <!-- macroquad looks up this exact id -->
    <canvas id="glcanvas" tabindex="1"></canvas>

    <div id="start" role="dialog" aria-modal="true" aria-labelledby="start-title">
      <p id="start-title">Block Coders</p>
      <button class="btn" id="go-full">Play full screen</button>
      <button class="btn ghost" id="go">Play</button>
    </div>

    <!-- Loaders vendored from the game's exact crate versions (see Cargo.lock):
         gl.js    = miniquad 0.4.11 js/gl.js
         audio.js = quad-snd 0.2.8 js/audio.js
         macroquad's all-in-one mq_js_bundle.js isn't used: its websocket plugin
         throws under "use strict" and the game doesn't need it. -->
    <script src="gl.js"></script>
    <script src="audio.js"></script>
    <script>
      "use strict";
      // Sound on iPad and iPhone.
      //
      // 1. Silent Mode. iOS plays Web Audio as "ambient" sound, which Silent Mode
      //    (the iPhone's silent switch, the iPad's Control Center bell) mutes
      //    completely. Asking for "playback" (iOS 17 and later) plays it anyway, like
      //    a video. The game's own Sound button still turns it off. This is set
      //    before audio.js makes its AudioContext (when the game loads).
      // 2. Older iOS can't be asked, but playing an HTML <audio> element switches the
      //    page to playback too, so after the first tap a short silent one loops.
      // 3. Unlocking. audio.js unlocks audio once, on the first touchstart, then
      //    removes its listeners. Safari doesn't count touchstart as a gesture that
      //    may start audio, so the game stayed silent. Until the game's AudioContext
      //    is running, every real gesture resumes it and starts a one-sample silent
      //    sound on it (some iOS versions need a sound started during the tap). This
      //    also restarts it after iOS pauses it for a call or an app switch.
      if (navigator.audioSession) {
        try { navigator.audioSession.type = "playback"; } catch (e) { /* not allowed: stay ambient */ }
      }
      (function () {
        // A quarter second of silence (8-bit mono WAV), for older iOS.
        const SILENCE = "data:audio/wav;base64,UklGRvQHAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YdAHAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==";
        let silent = null;
        function wake() {
          if (!navigator.audioSession && !silent) {
            silent = document.createElement("audio");
            silent.setAttribute("playsinline", "");
            silent.loop = true;
            silent.src = SILENCE;
            const playing = silent.play();
            if (playing) playing.catch(() => { silent = null; });
          }
          if (typeof audio_context === "undefined" || !audio_context || audio_context.state === "running") {
            return;
          }
          audio_context.resume();
          try {
            const tick = audio_context.createBufferSource();
            tick.buffer = audio_context.createBuffer(1, 1, audio_context.sampleRate);
            tick.connect(audio_context.destination);
            tick.start(0);
          } catch (e) { /* not ready yet: the next tap tries again */ }
        }
        ["touchend", "pointerup", "click", "mousedown", "keydown"].forEach((type) => {
          document.addEventListener(type, wake, true);
        });
      })();
    </script>
    <!-- Browser saves (localStorage). Copied from the game repo's web/ by scripts/build-game.sh. -->
    <script src="storage.js"></script>
    <script>
      "use strict";
      // Keyboard users must be able to leave the game (WCAG 2.1.2, no keyboard
      // trap). miniquad's gl.js cancels Tab on the canvas "for UI", but the game
      // never uses Tab, so stop Tab before it reaches the canvas and let the
      // browser move focus as usual (out of the iframe, back to the page).
      window.addEventListener("keydown", (e) => {
        if (e.key === "Tab") e.stopPropagation();
      }, true);
      load("block-coders.wasm");
      document.getElementById("glcanvas").focus();
    </script>
    <script>
      "use strict";
      // Phones and tablets: the game fits any screen, upright or sideways. Where the
      // browser can go full screen (Android, iPad; not iPhone Safari), offer it once,
      // before the game, on a card that then gets out of the way. A floating button
      // would cover the game's own buttons, which sit in every corner.
      // Presentation only: remembers the choice for this tab, sends nothing anywhere.
      (function () {
        const canvas = document.getElementById("glcanvas");
        const start = document.getElementById("start");
        const root = document.documentElement;
        const touch = matchMedia("(pointer: coarse)").matches;
        const canFullscreen = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
        const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
        let seen = false;
        try { seen = sessionStorage.getItem("bc-start-seen") === "1"; } catch (e) { /* storage blocked */ }

        function dismiss() {
          start.classList.remove("show");
          try { sessionStorage.setItem("bc-start-seen", "1"); } catch (e) { /* storage blocked */ }
          canvas.focus();
        }
        document.getElementById("go").addEventListener("click", dismiss);
        document.getElementById("go-full").addEventListener("click", async () => {
          try {
            if (root.requestFullscreen) await root.requestFullscreen({ navigationUI: "hide" });
            else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
          } catch (e) { /* the user or browser declined: play in the page */ }
          dismiss();
        });
        if (touch && canFullscreen && !isFullscreen() && !seen) {
          start.classList.add("show");
          document.getElementById("go-full").focus();
        }
      })();
    </script>
  </body>
</html>
