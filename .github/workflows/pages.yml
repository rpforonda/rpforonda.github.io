name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (which runs third-party actions and tools) can
# only read. Only the deploy job, which runs GitHub's own deploy-pages action,
# can publish the site.
permissions:
  contents: read

# Never cancel a run that may already be publishing: a deploy cut off halfway
# can leave Pages stuck until the workflow is re-run. Newer pushes wait instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The game lives in its own repo; build it fresh on every deploy.
      - uses: actions/checkout@v4
        with:
          repository: rpforonda/block-coders
          path: .game-src

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            .game-src

      # Installed straight into ~/.cargo/bin: jetli/trunk-action@v0.5.0 started failing
      # on 2026-10-23 ("EXDEV: cross-device link not permitted") because it moves the
      # binary from /tmp, which the runner now mounts separately. Pinned, so builds
      # don't change under us. The sha256 is the one published with the release.
      - name: Install Trunk (v0.22.0)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trunk.tar.gz" \
            https://github.com/trunk-rs/trunk/releases/download/v0.22.0/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "f78c1989240c56592d8cfc4df5cc27399a3ff66a3f9cc819e16f1e3d809ce7c2  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$HOME/.cargo/bin" trunk
          trunk --version

      # Pin a modern wasm-opt for both the site (Trunk uses whatever is on PATH)
      # and the game. Ubuntu's apt binaryen (v108) is too old and breaks
      # wasm-bindgen's externref table ("WebAssembly.Table.grow(): failed to grow table").
      - name: Install wasm-opt (binaryen version_123)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/binaryen.tar.gz" \
            https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz
          echo "e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_123/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/binaryen-version_123/bin/wasm-opt" --version

      - name: Build Block Coders → play/
        run: scripts/build-game.sh .game-src

      # A repo named <user>.github.io is served from the domain root;
      # any other repo is served from /<repo>/.
      - name: Build site
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == "${{ github.repository_owner }}.github.io" ]]; then base="/"; else base="/$repo/"; fi
          trunk build --release --public-url "$base"
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
