name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The game lives in its own repo; build it fresh on every deploy.
      - uses: actions/checkout@v4
        with:
          repository: rpforonda/block-coders
          path: .game-src

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            .game-src

      - uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Install wasm-opt
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build Block Coders → play/
        run: scripts/build-game.sh .game-src

      # A repo named <user>.github.io is served from the domain root;
      # any other repo is served from /<repo>/.
      - name: Build site
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == "${{ github.repository_owner }}.github.io" ]]; then base="/"; else base="/$repo/"; fi
          trunk build --release --public-url "$base"
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
