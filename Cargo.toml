[package]
name = "portfolio"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8.22", features = ["csr"] }
console_error_panic_hook = "0.1"
# Same version Leptos already pulls in; only adds the media-query, location,
# history, scroll-to and element-box APIs.
web-sys = { version = "0.3.106", features = ["MediaQueryList", "Location", "History", "ScrollToOptions", "ScrollBehavior", "DomRect", "CssStyleDeclaration"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
